<!-- Output Panel -->
<div class="output-panel">
    <!-- Output Card -->
    <div class="output-card">
        <div class="studio-output-header">
            <div>
                <span class="studio-output-kicker">CANVAS</span>
                <h2>결과 미리보기</h2>
            </div>
            <div class="studio-output-actions">
                <button class="studio-focus-toggle" type="button" aria-pressed="false" aria-label="캔버스 집중 모드" title="캔버스 집중 모드">
                    <i class="fas fa-expand"></i>
                    <span>집중 모드</span>
                </button>
                <button class="studio-gallery-shortcut" type="button" aria-label="최근 작업 열기" title="최근 작업 열기">
                    <i class="fas fa-clock-rotate-left"></i>
                    <span>최근 작업</span>
                </button>
            </div>
        </div>
        <div class="placeholder-section" id="placeholder-section">
            <div class="placeholder-card">
                <div class="placeholder-container">
                    <div class="placeholder-icon">
                        <i class="fas fa-image"></i>
                    </div>
                    <p class="placeholder-text">
                        그리고 싶은 내용을 프롬프트에 입력하고<br>"이미지 생성하기" 버튼을 눌러보세요!
                    </p>
                </div>
            </div>
        </div>
        <div class="result-section" id="result-section" style="display: none;">
            <div class="result-card">
                <div class="result-content">
                    <div class="image-container" id="result-image-container">
                        <img id="result-image" src="" alt="생성된 이미지 결과" class="result-image">
                        <button id="result-download-btn" class="result-download-btn" type="button" title="다운로드" aria-label="다운로드" style="display:none;">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <!-- Audio Result (ACE-Step) -->
                    <div class="audio-container" id="result-audio-container" style="display:none;">
                        <div class="audio-player-card">
                            <div class="audio-visual">
                                <i class="fas fa-compact-disc fa-spin" id="audio-spinning-icon" style="font-size:64px; color:var(--accent-primary); animation-play-state:paused;"></i>
                            </div>
                            <audio id="result-audio" controls preload="metadata" style="width:100%;"></audio>
                            <div style="display:flex; gap:8px; margin-top:8px; justify-content:center;">
                                <a id="audio-download-btn" href="#" download class="chip-btn" style="text-decoration:none;">
                                    <i class="fas fa-download"></i> MP3 다운로드
                                </a>
                            </div>
                        </div>
                    </div>
                    <!-- SeeThrough Result -->
                    <div class="seethrough-container" id="result-seethrough-container" style="display:none;">
                        <div class="seethrough-card" style="display:flex; flex-direction:column; gap:12px;">
                            <!-- PSD Download -->
                            <div class="seethrough-download" style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--bg-tertiary); border-radius:10px;">
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <i class="fas fa-file-image" style="font-size:20px; color:var(--accent-primary);"></i>
                                    <span style="font-size:14px; font-weight:500;">레이어 PSD</span>
                                    <span id="seethrough-psd-size" style="font-size:12px; color:var(--text-muted);"></span>
                                </div>
                                <a id="seethrough-psd-download" href="#" download="seethrough_output.psd" class="chip-btn" style="text-decoration:none;">
                                    <i class="fas fa-download"></i> PSD 다운로드
                                </a>
                            </div>
                            <!-- Parts Preview Grid -->
                            <details class="seethrough-parts-details" id="seethrough-parts-details">
                                <summary style="cursor:pointer; font-size:13px; color:var(--text-muted); padding:4px 0; user-select:none;">
                                    <i class="fas fa-layer-group"></i> 분리된 레이어 (<span id="seethrough-parts-count">0</span>개)
                                </summary>
                                <div id="seethrough-parts-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; margin-top:8px;"></div>
                            </details>
                        </div>
                    </div>
                    <p class="result-hint" id="result-hint">이미지를 클릭하면 크게 볼 수 있습니다</p>
                </div>
            </div>
        </div>
        <div class="preview-overlay" id="preview-overlay">
            <div class="preview-overlay-content">
                <div class="loading-spinner"></div>
                <div class="preview-overlay-tip typing-caret" id="preview-tip"></div>
            </div>
        </div>
    </div>
</div>
